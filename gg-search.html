<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GG Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #results { margin-top: 20px; }
        .result { margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #eee; }
        input[type="text"] { width: 300px; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h1 style="display: inline-block; margin: auto; font-size: 24px;">
        <span style="color: #4285F4; ">G</span>
        <span style="color: #EA4335;">o</span>
        <span style="color: #FBBC05;">o</span>
        <span style="color: #4285F4;">g</span>
        <span style="color: #34A853;">l</span>
        <span style="color: #EA4335;">e</span>
    </h1>
    <form id="searchForm"style="position: relative;">
        <input style="padding-left: 24px; border-radius: 12px;" type="text" id="query" placeholder="Search..." required>
        <div style="position: absolute; top:10px; left: 5px; opacity: 0.5;">
            <svg witdh="16px" height="16px" focusable="false" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
        </div>
        <button type="submit">Search</button>
        </form>
    <div id="results"></div>

    <style>
        button{
            border:none;
            background-color: #fff
        }
        button:hover {
            color: #4285F4;
            cursor: pointer;
        }
    </style>

    <script>
        const data = [
            { title: "Google Search", url: "https://www.google.com", description: "Search the world's information, including webpages, images, videos and more." },
            { title: "GitHub", url: "https://github.com", description: "Where the world builds software." },
            { title: "MDN Web Docs", url: "https://developer.mozilla.org", description: "Resources for developers, by developers." },
            { title: "Stack Overflow", url: "https://stackoverflow.com", description: "Where Developers Learn, Share, & Build Careers." },
            { title: "YouTube", url: "https://youtube.com", description: "Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world." }
        ];

        const form = document.getElementById('searchForm');
        const resultsDiv = document.getElementById('results');
        // Remove all children before search
        while (resultsDiv.firstChild) {
            resultsDiv.removeChild(resultsDiv.firstChild);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('query').value.trim().toLowerCase();
            resultsDiv.innerHTML = '';
            if (!query) return;

            const results = data.filter(item =>
                item.title.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                resultsDiv.innerHTML = '<p>No results found.</p>';
                return;
            }

            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result';
                div.innerHTML = `
                    <a href="${item.url}" target="_blank"><strong>${item.title}</strong></a>
                    <p>${item.description}</p>
                `;
                resultsDiv.appendChild(div);
            });
        });
    </script>
    
</body>
</html>
