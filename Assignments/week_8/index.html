    <script type="text/babel">
        function SearchForm({ value, onChangeValue, handleSubmit }) {
    return (
        <div>
            <input
                type="text"
                placeholder="Tìm theo id,name, username"
                value={value}
                onChange={(e) => onChangeValue(e.target.value.toLowerCase())}
            />

            <button
                onClick={() => {
                    handleSubmit?.();
                }}
            >
                Search
            </button>
        </div>
    );
}

    </script>
    <script type="text/babel">
        function AddUser({ open, value, onChangeValue, onSubmit }) {
    if (!open) return null;

    return (
        <div
            style={{
                display: "flex",
                flexDirection: "column",
                gap: "8px",
                padding: "16px",
                width: "320px",
                marginTop: "16px",
            }}
        >
            <input
                type="text"
                placeholder="Tên đăng nhập"
                value={value.userName || ""}
                onChange={(e) => onChangeValue("userName", e.target.value)}
            />
            <input
                placeholder="Họ và tên"
                value={value.fullName || ""}
                onChange={(e) => onChangeValue("fullName", e.target.value)}
            />
            <input
                placeholder="Email"
                value={value.email || ""}
                onChange={(e) => onChangeValue("email", e.target.value)}
            />
            <input
                placeholder="Số điện thoại"
                value={value.phone || ""}
                onChange={(e) => onChangeValue("phone", e.target.value)}
            />
            <input
                placeholder="Đường"
                value={value.address?.street || ""}
                onChange={(e) =>
                    onChangeValue("address", {
                        ...value.address,
                        street: e.target.value,
                    })
                }
            />
            <input
                placeholder="Thành phố"
                value={value.address?.city || ""}
                onChange={(e) =>
                    onChangeValue("address", {
                        ...value.address,
                        city: e.target.value,
                    })
                }
            />
            <input
                placeholder="Quốc gia"
                value={value.address?.country || ""}
                onChange={(e) =>
                    onChangeValue("address", {
                        ...value.address,
                        country: e.target.value,
                    })
                }
            />
            <input
                type="date"
                value={value.dateOfBirth || ""}
                onChange={(e) => onChangeValue("dateOfBirth", e.target.value)}
            />

            <button
                onClick={() => {
                    onSubmit?.();
                }}
            >
                Lưu người dùng
            </button>
        </div>
    );
}

    </script>
    <script type="text/babel" >
        function ResultTable({ results, onEdit, onDelete }) {
    return (
        <table
            border="1"
            cellPadding="6"
            style={{
                borderCollapse: "collapse",
                width: "100%",
                marginTop: "10px",
            }}
        >
            <thead style={{ background: "#f0f0f0" }}>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Date of Birth</th>
                    <th>Edit or delete</th>
                </tr>
            </thead>
            <tbody>
                {results.map((u) => (
                    <tr key={u.id || ""}>
                        <td>{u.id || ""}</td>
                        <td>{u.userName || ""}</td>
                        <td>{u.fullName || ""}</td>
                        <td>{u.email || ""}</td>
                        <td>{u.phone || ""}</td>
                        <td>
                            {u.address.street || ""}, {u.address.city || ""},{" "}
                            {u.address.country || ""}
                        </td>
                        <td>{u.dateOfBirth || ""}</td>
                        <td>
                            <button
                                onClick={() => {
                                    onEdit?.(u);
                                }}
                            >
                                edit
                            </button>
                            <button
                                onClick={() => {
                                    onDelete?.(u);
                                }}
                            >
                                delete
                            </button>
                        </td>
                    </tr>
                ))}
            </tbody>
        </table>
    );
}

    </script>

}

function App() {
    const [keyword, setKeyWord] = React.useState("");
    const [users, setUsers] = React.useState(usersSample);
    const [fecthData, setFecthData] = React.useState([]);
    const [result, setResult] = React.useState([]);
    const [error, setError] = React.useState(null);
    const [loading, setLoading] = React.useState(false);
    const [isEdit, setIsEdit] = React.useState(false);
    //add user
    const [open, setOpen] = React.useState(false);
    const [newUser, setNewUser] = React.useState({
        id: -1,
        userName: "",
        fullName: "",
        email: "",
        phone: "",
        address: {
            street: "",
            city: "",
            country: "",
        },
        dateOfBirth: "",
    });

    const handleSearch = async () => {
        //loading
        setLoading(true);

        //fake data
        let data = [];

        try {
            await new Promise((r) => setTimeout(r, 2000));
            data = users;
            setFecthData(data);

            // filter
            const foundUser = data.filter(
                (e) =>
                    e.id.toString() === keyword ||
                    e.userName.toLowerCase() === keyword ||
                    e.fullName.toLowerCase() === keyword
            );
            if (!foundUser) {
                throw new Error("user not found");
            }
            setResult(foundUser);
        } catch (error) {
            console.log("error: ", error);
            setError(error);
        } finally {
            setLoading(false);
        }
    };

    const handleSubmit = () => {
        if (!keyword) {
            alert("! Keyword is required");
            return;
        }
        handleSearch();
    };

    const handleChangeUserAddValue = (key, value) => {
        if (key in newUser) {
            setNewUser((prev) => ({ ...prev, [key]: value }));
        } else if (key in newUser.address) {
            setNewUser((prev) => ({
                ...prev,
                address: {
                    ...prev.address,
                    [key]: value,
                },
            }));
        }
    };

    const handleAddUser = () => {
        if (!newUser || newUser.userName?.length === 0) {
            alert("! new Username  is empty");
            return;
        }
        if (isEdit) {
            setUsers((prev) => {
                const filtered = prev.filter((u) => u.id !== newUser.id);
                const sorted = [...filtered, { ...newUser }].sort(
                    (a, b) => a.id - b.id
                );
                return sorted;
            });
            setIsEdit(false);
        } else {
            setUsers((prev) => [
                ...prev,
                {
                    ...newUser,
                    id: users.length + 1,
                },
            ]);
            alert("add user success");
        }

        setNewUser({
            id: -1,
            userName: "",
            fullName: "",
            email: "",
            phone: "",
            address: {
                street: "",
                city: "",
                country: "",
            },
            dateOfBirth: "",
        });
    };

    const handleEdit = (u) => {
        setIsEdit(true);
        setOpen(true);
        setNewUser(u);
    };
    const handleDelete = (u) => {
        setUsers((prev) => prev.filter((e) => e.id !== u.id));
    };
    return (
        <div>
            <SearchForm
                valu={keyword}
                onChangeValue={setKeyWord}
                handleSubmit={handleSubmit}
            />

            <div
                style={{
                    margin: 2,
                    border: "1px solid #ccc",
                    padding: 8,
                    borderRadius: 6,
                    width: "fit-content",
                    cursor: "pointer",

                onClick={() => {
                    setOpen(!open);
                }}
            >

                Thêm người dùng mới
            </div>
            <AddUser
                open={open}
                value={newUser}
                onChangeValue={handleChangeUserAddValue}
                onSubmit={handleAddUser}
            />

            {loading && <LoadingIndicator />}

            {result?.length > 0 && !loading && !error && (
                <ResultTable
                    results={result}
                    onEdit={handleEdit}
                    onDelete={handleDelete}
                />
            )}

            <div
                style={{
                    margin: 2,
                    border: "1px solid #ccc",
                    padding: 8,
                    borderRadius: 6,
                    width: "fit-content",
                    cursor: "pointer",
                }}
            >

                Full data user
            </div>
            <ResultTable
                results={users}
                onEdit={handleEdit}
                onDelete={handleDelete}
            />
        </div>
