<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Search Page</title>
</head>
<body>
    <div id="root"></div>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Base Fetch Class -->
    <script>
        class FetchData {
            baseUrl = "http://localhost:3000";

            async request(method, url, body = null) {
                const options = {
                    method,
                    headers: { "Content-Type": "application/json" }
                };

                if (body) options.body = JSON.stringify(body);

                const response = await fetch(this.baseUrl + url, options);
                return response.json();
            }

            GET(url) { return this.request("GET", url); }
            POST(url, body) { return this.request("POST", url, body); }
            PUT(url, body) { return this.request("PUT", url, body); }
            DELETE(url) { return this.request("DELETE", url); }
        }
        const fetchData = new FetchData();
    </script>

    <!-- SearchBar Component -->
    <script type="text/babel">
        function SearchBar({ searchValue, onChange, onSearch }) {
            return (
                <div style={{ marginBottom: "20px" }}>
                    <input
                        type="text"
                        placeholder="Search user..."
                        value={searchValue}
                        onChange={(e) => onChange(e.target.value?.trim())}
                        style={{ padding: "8px", width: "260px" }}
                    />
                    <button
                        onClick={onSearch}
                        style={{ padding: "8px 14px", marginLeft: "10px" }}
                    >
                        Search
                    </button>
                </div>
            );
        }
    </script>

    <!-- Table Component -->
    <script type="text/babel">
        function UserTable({ users, page, onEdit, onDelete }) {
            return (
                <table border="1" cellPadding="10" style={{ width: "100%", marginTop: "20px" }}>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {users.length === 0 ? (
                            <tr><td colSpan="3">No users found.</td></tr>
                        ) : (
                            users.map((user, index) => (
                                <UserRow
                                    key={index}
                                    index={(page-1)*10+index+1}
                                    user={user}
                                    onEdit={onEdit}
                                    onDelete={onDelete}
                                />
                            ))
                        )}
                    </tbody>
                </table>
            );
        }

        function UserRow({ user, index, onEdit, onDelete }) {
            const [editing, setEditing] = React.useState(false);
            const [form, setForm] = React.useState({
                name: user.name,
                age: user.age
            });

            return (
                <>
                    <tr>
                        <td>{index}</td>
                        <td>{user.name}</td>
                        <td>{user.age}</td>

                        <td>
                            <button onClick={() => setEditing(!editing)}>
                                {editing ? "Close" : "Edit"}
                            </button>

                            <button
                                style={{ marginLeft: "10px", color: "red" }}
                                onClick={() => {
                                    if (confirm("Delete this user?")) {
                                        onDelete(user._id);
                                    }
                                }}
                            >
                                Delete
                            </button>
                        </td>
                    </tr>

                    {editing && (
                        <tr>
                            <td colSpan="3" style={{ background: "#f8f8f8" }}>
                                <div style={{ padding: "10px" }}>
                                    <div>
                                        <label>Name: </label>
                                        <input
                                            type="text"
                                            value={form.name}
                                            onChange={(e) =>
                                                setForm({ ...form, name: e.target.value.trim() })
                                            }
                                        />
                                    </div>

                                    <div style={{ marginTop: "10px" }}>
                                        <label>Age: </label>
                                        <input
                                            type="number"
                                            value={form.age}
                                            onChange={(e) =>
                                                setForm({ ...form, age: Number(e.target.value) })
                                            }
                                        />
                                    </div>

                                    <div style={{ marginTop: "10px" }}>
                                        <button
                                            onClick={() => {
                                                onEdit(user._id, form);
                                                setEditing(false);
                                            }}
                                        >
                                            Save
                                        </button>

                                        <button
                                            style={{ marginLeft: "10px" }}
                                            onClick={() => {
                                                setEditing(false);
                                                setForm({ name: user.name, age: user.age }); // reset
                                            }}
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    )}
                </>
            );
        }
    </script>



    <!-- Pagination Component -->
    <script type="text/babel">
        function Pagination({ page, totalPages, onChange }) {
            return (
                <div style={{ marginTop: "20px" }}>
                    <button 
                        disabled={page === 1} 
                        onClick={() => onChange(page - 1)}
                    >
                        Prev
                    </button>

                    <span style={{ margin: "0 10px" }}>
                        Page {page} / {totalPages}
                    </span>

                    <button 
                        disabled={page === totalPages} 
                        onClick={() => onChange(page + 1)}
                    >
                        Next
                    </button>
                </div>
            );
        }
    </script>

    <!-- Main App Component -->
    <script type="text/babel">
        function App() {
            const [searchText, setSearchText] = React.useState("");
            const [users, setUsers] = React.useState([]);

            const [page, setPage] = React.useState(1);
            const [totalPages, setTotalPages] = React.useState(1);

            async function FetchDataUser() {
                const res = await fetchData.GET(`/api/user?page=${page}`);

                setUsers(res?.data || []);
                setTotalPages(res?.total || 1);
            }

            React.useEffect(() => {
                FetchDataUser();
            }, [page]);

            const handleSearchUser = async()=>{
                try{
                    const res = await fetchData.GET(`/api/user?name=${searchText}`)
                    setUsers(res?.data || []);
                    setTotalPages(res?.total || 1);
                }catch(error){
                    alert("search user error: ", error)
                }
            }

            const handleEdit = async(id, form)=>{
                try{
                    const res = await fetchData.PUT(`/api/user/${id}`)
                    alert("search user success");
                }catch(error){
                    alert("search user error: ", error)
                }
            }

            return (
                <div style={{ width: "600px", margin: "40px auto" }}>
                    <h2>User Search</h2>

                    <SearchBar
                        searchValue={searchText}
                        onChange={setSearchText}
                        onSearch={()=>{ 
                            handleSearchUser()
                        }}
                    />

                    <UserTable 
                        page={page}
                        users={users}
                        onEdit={(id, update) => {
                            console.log("Edit user", id, update);
                            handleEdit(id, update)
                        }}
                        onDelete={(id) => {
                            console.log("Delete user", id);
                            // gọi API DELETE tại đây
                        }} />

                    <Pagination
                        page={page}
                        totalPages={totalPages}
                        onChange={setPage}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
